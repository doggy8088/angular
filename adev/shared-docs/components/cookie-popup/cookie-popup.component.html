@if (!hasAccepted()) {
  <div class="docs-cookies-popup docs-invert-mode">
    <div class="docs-cookies-popup-header">
      <img
        class="docs-cookies-popup-angie"
        src="assets/images/angie/greeting.svg"
        alt=""
        aria-hidden="true"
      />
      <p>本網站使用 Google 的 cookie 來提供服務並分析流量。</p>
    </div>

    <div class="docs-cookies-popup-actions">
      <a
        href="https://policies.google.com/technologies/cookies"
        target="_blank"
        rel="noopener"
        class="docs-primary-btn"
        aria-label="深入了解 Google 如何使用 cookie"
        text="深入了解"
      >
        深入了解
      </a>

      <button
        type="button"
        (click)="accept()"
        class="docs-primary-btn"
        text="好的，我知道了"
        aria-label="好的，我知道了"
      >
        好的，我知道了
      </button>
    </div>
  </div>
}
