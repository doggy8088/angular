name: Deploy zh-TW site to GitHub Pages

# zh-tw 分支專屬：建置 adev（angular.dev）並部署到 GitHub Pages
# 自訂網域：angular-dev.gh.miniasp.com（於 repo Pages 設定以 API 指定）
# 注意：上游 preview 建置使用 Google RBE 遠端建置，fork 無憑證可用，
# 因此這裡改用 runner 本地 Bazel 建置（不加 --config=remote）。

on:
  push:
    branches: [zh-tw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # v2：第一輪 run（42512792694）的 job 被 GitHub 端取消成殭屍狀態、長期占用 v1 群組，
  # 改名讓新 run 不被殭屍擋住；殭屍 run 的 deploy 步驟早已 skipped，不會與新 run 競爭部署。
  group: pages-zhtw-v2
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build adev (production)
        # 資源上限：16GB runner 上 Bazel server 連續兩次在建置尾聲（16,818/16,925、
        # 16,841/16,925）突然死亡（Server terminated abruptly, connection reset），
        # 屬記憶體壓力而非內容錯誤；限制平行任務數與 server heap 換取穩定完成。
        run: pnpm bazel --host_jvm_args=-Xmx3g build //adev:build.production --jobs=1 --local_ram_resources=4096

      - name: Collect static output
        run: |
          mkdir -p _site
          cp -rL dist/bin/adev/dist/browser/. _site/
          ls _site | head -20
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
