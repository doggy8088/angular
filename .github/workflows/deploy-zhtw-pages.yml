name: Deploy zh-TW site to Cloudflare Pages

# zh-tw 分支專屬：建置 adev（angular.dev）並部署到 Cloudflare Pages
# 自訂網域：dev.angular.tw（Cloudflare Pages 專案 dev-angular-tw，直接上傳型）
# 2026-11-09 自 GitHub Pages 遷移：GitHub Pages 無法自訂回應標頭，
# Playground/WebContainer 需要 COOP/COEP 跨源隔離標頭，改由 _headers 提供。
# 注意：上游 preview 建置使用 Google RBE 遠端建置，fork 無憑證可用，
# 因此這裡改用 runner 本地 Bazel 建置（不加 --config=remote）。

on:
  push:
    branches: [zh-tw]
  workflow_dispatch:
    inputs:
      attempt:
        description: "Deployment attempt number (auto-incremented on auth failure)"
        required: false
        default: "1"

permissions:
  contents: read
  actions: write

concurrency:
  # v2：第一輪 run（42512792694）的 job 被 GitHub 端取消成殭屍狀態、長期占用 v1 群組，
  # 改名讓新 run 不被殭屍擋住；殭屍 run 的 deploy 步驟早已 skipped，不會與新 run 競爭部署。
  group: pages-zhtw-v2
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Probe Cloudflare auth (fail fast, re-dispatch on a fresh runner)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/dev-angular-tw/upload-token" -H "Authorization: Bearer ${CF_TOKEN}")
            echo "probe $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            attempt="${{ inputs.attempt || '1' }}"
            if [ "$attempt" -lt 6 ]; then
              next=$((attempt + 1))
              echo "This runner cannot authenticate to Cloudflare (9106). Re-dispatching attempt $next on a fresh runner."
              gh workflow run deploy-zhtw-pages.yml --ref zh-tw -f attempt=$next
            else
              echo "Giving up after $attempt attempts."
            fi
            exit 1
          fi
          echo "Cloudflare auth OK on this runner."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Bazel repository cache
        # 外部依賴下載一次成功後就留在快取裡，之後的建置不必再碰 GitHub 下載
        # （2026-11-09 GitHub release 下載連續 504 的因應）。金鑰綁 MODULE.bazel.lock。
        uses: actions/cache@v4
        with:
          path: .bazel-repository-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-

      - name: Build adev (production)
        # 資源上限：16GB runner 上 Bazel server 連續兩次在建置尾聲（16,818/16,925、
        # 16,841/16,925）突然死亡（Server terminated abruptly, connection reset），
        # 屬記憶體壓力而非內容錯誤；限制平行任務數與 server heap 換取穩定完成。
        # 重試：2026-11-09 GitHub release 下載連續回 504，fetch 階段會隨機死在
        # 不同依賴上；同一 job 內重跑時 Bazel 快取保留已下載的依賴，逐輪收斂。
        run: |
          for attempt in 1 2 3; do
            echo "=== Build attempt ${attempt} ==="
            if pnpm bazel --host_jvm_args=-Xmx3g build //adev:build.production --jobs=1 --local_ram_resources=4096; then
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          echo "Build failed after 3 attempts"
          exit 1

      - name: Collect static output
        run: |
          mkdir -p _site
          cp -rL dist/bin/adev/dist/browser/. _site/
          ls _site | head -20
          test -f _site/index.html

      - name: Add Cloudflare Pages headers
        # 比照上游 adev/firebase.json 的標頭規則：全站 COOP/COEP 跨源隔離
        # （Playground 的 WebContainer / SharedArrayBuffer 必需）、教學圖片
        # 與 versions.json 的 CORP、service worker 不快取。
        run: |
          cat > _site/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: credentialless

          /assets/images/tutorials/common/*
            Cross-Origin-Resource-Policy: cross-origin
            Access-Control-Allow-Origin: *

          /assets/others/versions.json
            Cross-Origin-Resource-Policy: cross-origin
            Access-Control-Allow-Origin: *

          /ngsw-worker.js
            Cache-Control: no-cache

          /ngsw.json
            Cache-Control: no-cache
          EOF
          cat _site/_headers

      - name: Archive site output (deploy fallback)
        uses: actions/upload-artifact@v4
        with:
          name: site-zhtw
          path: _site
          retention-days: 3
          compression-level: 0

      - name: Deploy to Cloudflare Pages
        # 不用 wrangler／cf CLI：兩者對 cfut_ 前綴 Token 的認證都會被 Cloudflare
        # API 以 9106/6111 拒絕（2026-11-09 多輪實測），但同一支 Token 走一般
        # API 呼叫完全正常。改用自實作的 Pages Direct Upload 協議上傳器
        # （.github/scripts/pages_upload.py，協議與雜湊皆比照官方文件與
        # wrangler 原始碼驗證）。也不用 wrangler-action（pnpm 根目錄安裝問題）。
        env:
          CLOUDFLARE_API_TOKEN: <redacted>
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install -q blake3 requests
          # Cloudflare 對 GitHub runner 出口的 Token 驗證有「時間窗」現象：
          # 同一台 runner 開工時可通、20 分鐘後可變 9106（2026-11-10 實測）。
          # 部署步因此長時間重試（公開 repo Actions 分鐘免費），等窗開。
          for attempt in 1 2 3 4 5 6; do
            echo "=== Deploy attempt ${attempt} ==="
            if python3 .github/scripts/pages_upload.py --project dev-angular-tw --branch zh-tw --dir _site; then
              exit 0
            fi
            echo "Deploy attempt ${attempt} failed; waiting 5 minutes for a better auth window..."
            sleep 300
          done
          echo "Deploy failed after 6 attempts"
          exit 1
