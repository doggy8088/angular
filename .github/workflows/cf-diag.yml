name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Warm-up curl GET then Python token call
        env:
          CLOUDFLARE_API_TOKEN: <redacted>
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install -q requests
          echo "== egress IP and colo"
          curl -s "https://api.cloudflare.com/cdn-cgi/trace" | grep -E "^(ip|colo)=" || true
          echo "== warm-up GETs (zones, project read)"
          curl -s -o /dev/null -w "zones: %{http_code}\n" "https://api.cloudflare.com/client/v4/zones/d8415895d0d97ed5f9996bc4f228df08" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl -s -o /dev/null -w "project read: %{http_code}\n" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/dev-angular-tw" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          cat > probe3.py <<'PY'
          import os, requests
          tok = os.environ['CLOUDFLARE_API_TOKEN']; acct = os.environ['CLOUDFLARE_ACCOUNT_ID']
          url = f'https://api.cloudflare.com/client/v4/accounts/{acct}/pages/projects/dev-angular-tw/upload-token'
          r = requests.get(url, headers={'Authorization': f'Bearer {tok}'}, timeout=60)
          print('python requests upload-token after warm-up:', r.status_code, r.text[:150])
          PY
          python3 probe3.py
