name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Wrangler whoami with stripped token
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@3
          export CLOUDFLARE_API_TOKEN="${RAW_TOKEN#cfut_}"
          echo "stripped token length: ${#CLOUDFLARE_API_TOKEN}"
          wrangler whoami 2>&1 | head -12
          echo "=== pages project list ==="
          wrangler pages project list 2>&1 | head -8
