name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Characterize the current secret inside the runner
        env:
          T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "length: ${#T1}"
          echo -n "cfut_ prefix: "; case "$T1" in cfut_*) echo yes;; *) echo no;; esac
          echo -n "curl verify: "
          curl -s -o /dev/null -w "%{http_code}\n" "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer ${T1}"
          echo -n "curl upload-token: "
          curl -s -o /dev/null -w "%{http_code}\n" "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/dev-angular-tw/upload-token" -H "Authorization: Bearer ${T1}"
