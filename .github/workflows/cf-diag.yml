name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Prototype Pages direct upload via API (stub site to v21)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install -q blake3 requests
          mkdir -p _stub/assets && echo '<h1>v21 stub</h1>' > _stub/index.html && echo 'body{color:red}' > _stub/assets/app.css
          cat > _stub/_headers <<'HDR'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: credentialless
          HDR
          cat > upload.py <<'PY'
          import base64, hashlib, json, os, sys
          import requests
          from blake3 import blake3

          TOKEN = os.environ['CF_TOKEN']; ACCOUNT = os.environ['CF_ACCOUNT']
          PROJECT = 'angular-tw-v21'; BRANCH = 'v21'; ROOT = '_stub'
          API = 'https://api.cloudflare.com/client/v4'
          H = {'Authorization': f'Bearer {TOKEN}'}

          def asset_hash(path):
              data = open(path, 'rb').read()
              ext = os.path.splitext(path)[1].lstrip('.')
              return blake3((base64.b64encode(data).decode() + ext).encode()).hexdigest()[:32], data

          manifest, files = {}, {}
          special = {}
          for dirpath, _, names in os.walk(ROOT):
              for n in names:
                  full = os.path.join(dirpath, n)
                  rel = '/' + os.path.relpath(full, ROOT).replace(os.sep, '/')
                  if n in ('_headers', '_redirects'):
                      special[n] = open(full).read(); continue
                  h, data = asset_hash(full)
                  manifest[rel] = h; files[h] = (rel, data)
          print('manifest:', manifest)

          r = requests.get(f'{API}/accounts/{ACCOUNT}/pages/projects/{PROJECT}/upload-token', headers=H)
          print('upload-token:', r.status_code)
          res = r.json()['result']
          print('result type:', type(res).__name__, 'keys:', list(res) if isinstance(res, dict) else '-', 'len:', len(res) if isinstance(res, str) else '-')
          jwt = res if isinstance(res, str) else res.get('token') or res.get('jwt')
          import base64 as _b64
          payload = jwt.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          print('jwt claims:', json.loads(_b64.urlsafe_b64decode(payload)))

          JH = {'Authorization': f'Bearer {jwt}'}
          ns = json.loads(_b64.urlsafe_b64decode(payload))['projectNamespace']
          ASSETS = 'https://api.pages.cloudflare.com/pages/assets'
          hashes = list(files)
          variants = [
              ('query', f'{ASSETS}/check-missing?assetNamespace={ns}', JH, {'hashes': hashes}),
              ('body', f'{ASSETS}/check-missing', JH, {'hashes': hashes, 'assetNamespace': ns}),
              ('header', f'{ASSETS}/check-missing', {**JH, 'X-Asset-Namespace': ns}, {'hashes': hashes}),
          ]
          style = None
          for name, url, hdrs, body in variants:
              r = requests.post(url, headers=hdrs, json=body)
              print('check-missing', name, ':', r.status_code, r.text[:120])
              if r.status_code == 200:
                  style = name; missing = r.json()['result']; break
          assert style, 'no variant worked'

          def asset_url(path):
              return f'{ASSETS}/{path}?assetNamespace={ns}' if style == 'query' else f'{ASSETS}/{path}'
          def asset_headers():
              return {**JH, 'X-Asset-Namespace': ns} if style == 'header' else JH
          def asset_body(extra):
              return {**extra, 'assetNamespace': ns} if style == 'body' else extra

          form = {}
          for h in missing:
              rel, data = files[h]
              form[h] = (os.path.basename(rel), base64.b64encode(data).decode())
          r = requests.post(asset_url('upload'), headers=asset_headers(), files=form)
          print('bulk upload:', r.status_code, r.text[:200])

          r = requests.post(asset_url('upsert-hashes'), headers=asset_headers(), json=asset_body({'hashes': hashes}))
          print('upsert-hashes:', r.status_code, r.text[:150])

          form = {'manifest': (None, json.dumps(manifest)), 'branch': (None, BRANCH),
                  'commit_message': (None, 'stub deploy via API prototype'),
                  'commit_dirty': (None, 'false')}
          for k, v in special.items():
              form[k] = (None, v)
          r = requests.post(f'{API}/accounts/{ACCOUNT}/pages/projects/{PROJECT}/deployments', headers=H, files=form)
          print('create deployment:', r.status_code, r.text[:400])
          PY
          python3 upload.py
