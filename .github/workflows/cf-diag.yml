name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze secret shape (no values printed)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "length: ${#CF_TOKEN}"
          echo -n "charset [A-Za-z0-9_-] only: "; echo "$CF_TOKEN" | grep -qE '^[A-Za-z0-9_-]+$' && echo yes || echo NO
          echo -n "contains space: "; case "$CF_TOKEN" in *" "*) echo yes;; *) echo no;; esac
          echo -n "contains dot: "; case "$CF_TOKEN" in *.*) echo yes;; *) echo no;; esac
          echo -n "contains equals: "; case "$CF_TOKEN" in *=*) echo yes;; *) echo no;; esac
          echo -n "contains slash or plus: "; case "$CF_TOKEN" in */*|*+*) echo yes;; *) echo no;; esac
          echo -n "prefix shape (first 5 chars are letters): "; echo "$CF_TOKEN" | cut -c1-5 | grep -qE '^[A-Za-z]+$' && echo yes || echo no
          echo -n "has underscore in first 6 chars: "; echo "$CF_TOKEN" | cut -c1-6 | grep -q '_' && echo yes || echo no

      - name: Wrangler with unsanitized debug log
        env:
          CLOUDFLARE_API_TOKEN: <redacted>
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: debug
          WRANGLER_LOG_SANITIZE: "false"
        run: |
          npm install -g wrangler@3
          wrangler whoami 2>&1 | grep -iE "START CF API REQUEST|HEADERS|Authorization|User-Agent|Accept|Content-Type|ERROR|code" | head -20 || true
