name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: One process, two HTTP stacks, same token
        env:
          CLOUDFLARE_API_TOKEN: <redacted>
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install -q requests
          cat > probe2.py <<'PY'
          import json, os, subprocess, requests
          tok = os.environ['CLOUDFLARE_API_TOKEN']; acct = os.environ['CLOUDFLARE_ACCOUNT_ID']
          url = f'https://api.cloudflare.com/client/v4/accounts/{acct}/pages/projects/dev-angular-tw/upload-token'
          out = subprocess.run(['curl', '-s', url, '-H', f'Authorization: Bearer {tok}'],
                               capture_output=True, text=True)
          d = json.loads(out.stdout)
          print('curl in-process:', d.get('success'), [e.get('code') for e in d.get('errors', [])])
          r = requests.get(url, headers={'Authorization': f'Bearer {tok}'}, timeout=60)
          print('requests UA sent:', r.request.headers.get('User-Agent'))
          print('requests:', r.status_code, r.text[:150])
          PY
          python3 probe2.py
