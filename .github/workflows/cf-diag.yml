name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Capture CLI request headers via local echo server
        env:
          CLOUDFLARE_API_TOKEN: <redacted>
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > echo-server.js <<'JS'
          const http = require('http');
          const srv = http.createServer((req, res) => {
            const out = { method: req.method, url: req.url, headers: {} };
            for (const [k, v] of Object.entries(req.headers)) {
              if (k.toLowerCase() === 'authorization') {
                out.headers[k] = `<len=${v.length} startsWithBearer=${v.startsWith('Bearer ')} startsWithBearerSpace=${v.startsWith('Bearer  ')}>`;
              } else {
                out.headers[k] = v;
              }
            }
            console.log('CAPTURED ' + JSON.stringify(out));
            res.writeHead(400, { 'content-type': 'application/json' });
            res.end(JSON.stringify({ success: false, errors: [{ code: 9999, message: 'echo' }], messages: [], result: null }));
          });
          srv.listen(8899, () => console.log('echo server up'));
          JS
          node echo-server.js > echo.log 2>&1 &
          sleep 1
          npm install -g wrangler@3 cf
          echo "=== wrangler whoami via echo ==="
          CLOUDFLARE_API_BASE_URL="http://127.0.0.1:8899/client/v4" wrangler whoami 2>&1 | head -4 || true
          echo "=== cf pages list via echo ==="
          CLOUDFLARE_API_BASE_URL="http://127.0.0.1:8899/client/v4" cf pages list 2>&1 | head -6 || true
          sleep 1
          echo "=== captured requests ==="
          grep CAPTURED echo.log || echo "nothing captured"
