name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Verify new secret shape and token endpoint stability
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "length: ${#CF_TOKEN}"
          echo -n "prefix: "
          case "$CF_TOKEN" in
            cfat_*) echo "cfat_ (account token)";;
            cfut_*) echo "cfut_ (user token)";;
            *) echo "other / unprefixed";;
          esac
          for proj in dev-angular-tw angular-tw-v21; do
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${proj}/upload-token" -H "Authorization: Bearer ${CF_TOKEN}")
              echo "$proj try $i: $code"
              sleep 3
            done
          done
