name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Long-window upload-token polling
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=0; fail=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/dev-angular-tw/upload-token" -H "Authorization: Bearer ${CF_TOKEN}")
            ts=$(date -u +%H:%M:%S)
            echo "try $i at $ts -> $code"
            if [ "$code" = "200" ]; then ok=$((ok+1)); else fail=$((fail+1)); fi
            sleep 20
          done
          echo "SUMMARY ok=$ok fail=$fail"
