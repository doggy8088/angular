name: Diagnose Cloudflare auth (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe cf pages commands with existing token
        env:
          CLOUDFLARE_API_TOKEN: <redacted>
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g cf
          echo "=== cf pages list ==="
          cf pages list 2>&1 | head -30 || true
          echo "=== cf pages deployments create --help ==="
          cf pages deployments create --help 2>&1 | head -60 || true
