<h2>我們即將發表的場次：</h2>
<div *ngIf="!upcomingEvents?.length">
  <p>目前沒有即將到來的演講活動。</p>
  <p>在有新活動之前，歡迎查看我們的 <a href="https://www.youtube.com/angular">YouTube 頻道</a>
    ，並在<a href="https://twitter.com/angular">社群媒體</a>上追蹤我們。</p>
  <p>如果你希望我們參與你的活動，請來信 <a href="mailto:devrel@angular.io">devrel@angular.io</a>！</p>
</div>

<table class="is-full-width" *ngIf="upcomingEvents?.length">
  <thead>
    <tr>
      <th>Event</th>
      <th>Location</th>
      <th>Date</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let event of upcomingEvents">
      <th><a href="{{event.linkUrl}}" title="{{event.tooltip}}">{{event.name}}</a></th>
      <td>{{event.location}}</td>
      <td>
        <div>
          {{getEventDates(event)}}
        </div>
      </td>
    </tr>
  </tbody>
</table>

<br />

<h2>我們曾經發表的場次：</h2>
<table class="is-full-width">
  <thead>
    <tr>
      <th>Event</th>
      <th>Location</th>
      <th>Date</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let event of pastEvents">
      <th><a href="{{event.linkUrl}}" title="{{event.tooltip}}">{{event.name}}</a></th>
      <td>{{event.location}}</td>
      <td>
        <div>
          {{getEventDates(event)}}
        </div>
      </td>
    </tr>
  </tbody>
</table>
